name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          # Read the version from go.mod so CI cannot drift from the module.
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        # GoReleaser's before hook runs `go mod tidy`, so an untidy module would
        # otherwise be silently corrected during the build instead of reported.
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig || ! diff -q go.sum go.sum.orig; then
            echo "go.mod/go.sum are not tidy. Run 'go mod tidy' and commit:"
            diff go.mod.orig go.mod || true
            diff go.sum.orig go.sum || true
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Installed so CI runs the same command a developer runs locally, rather
      # than a copy of it that can drift. Pinned by commit like every other
      # action here.
      - name: Install just
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just

      - name: Test
        run: just test-race

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # GoReleaser wants tags to derive a snapshot version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: GoReleaser build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: build --snapshot --clean
